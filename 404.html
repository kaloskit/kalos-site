<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page Not Found | KALOS</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 400 600; font-display: swap; src: url('/assets/fonts/archivo-latin.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 500; font-display: swap; src: url('/assets/fonts/jetbrains-mono-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Syne'; font-style: normal; font-weight: 700 800; font-display: swap; src: url('/assets/fonts/syne-wordmark.woff2') format('woff2'); unicode-range: U+4B-4C, U+4F, U+53, U+39B; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #232629; color: #E8E6E1; font-family: 'Archivo', 'Helvetica Neue', sans-serif;
    text-align: center; padding: 24px;
  }
  .wordmark { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: 0.06em; color: #FDFCFA; text-decoration: none; }
  .code { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #9AA0A0; letter-spacing: 0.2em; margin: 28px 0 10px; }
  h1 { font-size: 26px; font-weight: 500; color: #FDFCFA; margin-bottom: 12px; }
  p { font-size: 15px; color: #9AA0A0; margin-bottom: 28px; }
  .home { display: inline-block; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; color: #FDFCFA; text-decoration: none; border: 1px solid #C0703A; padding: 12px 26px; }
  .home:hover { background: #C0703A; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
  <main>
    <a href="/" class="wordmark"><span aria-hidden="true">KΛLOS</span><span class="sr-only">KALOS home</span></a>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>This page doesn't exist, or it moved when the site launched.</p>
    <a href="/" class="home">Back to the Studio</a>
  </main>
</body>
</html>
